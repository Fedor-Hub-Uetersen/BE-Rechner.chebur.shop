<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feodors BE-Rechner</title>
    
    <!-- Фавикон с неоновым волком -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><circle cx='250' cy='250' r='230' fill='%230d1117'/><circle cx='250' cy='250' r='200' fill='none' stroke='%2300f3ff' stroke-width='12'/><g stroke='%2300f3ff' stroke-width='14' stroke-linecap='round' stroke-linejoin='round' fill='none'><path d='M160 180 L190 80 L230 160'/><path d='M340 180 L310 80 L270 160'/><path d='M130 240 L170 210 L150 280 L190 260 L170 330 L210 300 L190 380 L250 420 L310 380 L290 300 L330 330 L310 260 L350 280 L330 210 L370 240 L340 180'/><polygon points='205,230 235,240 215,250' fill='%2300f3ff'/><polygon points='295,230 265,240 285,250' fill='%2300f3ff'/><path d='M220 300 L250 360 L280 300'/><path d='M235 330 L250 360 L265 330' fill='%2300f3ff'/></g></svg>">

    <style>
        :root {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --text-color: #2c3e50;
            --border-color: #00f3ff;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --result-bg: #eaf3fa;
            --result-text: #1b3a54;
            --btn-bg: #2b5b84;
            --btn-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --text-color: #e6edf3;
            --border-color: #00f3ff;
            --input-bg: #21262d;
            --input-border: #30363d;
            --result-bg: #1c2d3d;
            --result-text: #58a6ff;
            --btn-bg: #00f3ff;
            --btn-text: #0d1117;
        }

        body {
            background-color: var(--bg-body);
            transition: background-color 0.3s;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .xe-calculator {
            max-width: 420px;
            margin: 20px auto;
            padding: 25px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            background-color: var(--bg-card);
            color: var(--text-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
            transition: all 0.3s;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .controls-bar button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .xe-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-signature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-text-left {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            color: #38ef7d;
            text-transform: capitalize;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(56, 239, 125, 0.6);
        }

        .brand-text-right {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            color: #00f3ff;
            text-transform: lowercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .cyber-wolf-svg {
            width: 75px;
            height: 75px;
            filter: drop-shadow(0 0 10px #00f3ff);
            flex-shrink: 0;
        }

        .xe-calculator h3 {
            margin-top: 5px;
            margin-bottom: 0;
            color: var(--text-color);
            font-size: 18px;
        }

        .xe-field {
            margin-bottom: 15px;
        }

        .xe-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .xe-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 16px;
        }

        .xe-result {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--result-bg);
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--result-text);
            border: 1px solid rgba(0, 243, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="xe-calculator">
    <div class="controls-bar">
        <button id="langBtn" onclick="toggleLanguage()">RU</button>
        <button id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    </div>

    <div class="xe-header">
        <div class="brand-signature">
            <span class="brand-text-left">Tech</span>
            <svg class="cyber-wolf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
                <circle cx="250" cy="250" r="230" fill="#0d1117"/>
                <circle cx="250" cy="250" r="200" fill="none" stroke="#00f3ff" stroke-width="8"/>
                <circle cx="250" cy="250" r="185" fill="none" stroke="#3a86ff" stroke-width="3" opacity="0.6"/>
                <g stroke="#00f3ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
                    <path d="M160 180 L190 80 L230 160"/>
                    <path d="M340 180 L310 80 L270 160"/>
                    <path d="M130 240 L170 210 L150 280 L190 260 L170 330 L210 300 L190 380 L250 420 L310 380 L290 300 L330 330 L310 260 L350 280 L330 210 L370 240 L340 180"/>
                    <path d="M220 300 L250 360 L280 300"/>
                    <path d="M235 330 L250 360 L265 330" fill="#00f3ff"/>
                    <polygon points="205,230 235,240 215,250" fill="#00f3ff"/>
                    <polygon points="295,230 265,240 285,250" fill="#00f3ff"/>
                </g>
            </svg>
            <span class="brand-text-right">chebur</span>
        </div>
        <h3 id="calcTitle"> BE-Rechner</h3>
    </div>
    
    <div class="xe-field">
        <label id="labelCarbs" for="carbs">Kohlenhydrate pro 100g (g):</label>
        <input type="number" id="carbs" placeholder="z.B. 65" oninput="calculateXE()">
    </div>
    
    <div class="xe-field">
        <label id="labelWeight" for="weight">Portionsgewicht (g):</label>
        <input type="number" id="weight" placeholder="z.B. 150" oninput="calculateXE()">
    </div>

    <div class="xe-result">
        <span id="labelResult">Ergebnis:</span> <span id="xeValue">0</span> <span id="unitLabel">BE</span>
    </div>
</div>

<script>
let currentLang = 'de';
let currentTheme = 'light';

const i18n = {
    de: {
        title: "BE-Rechner",
        carbs: "Kohlenhydrate pro 100g (g):",
        weight: "Portionsgewicht (g):",
        carbsPh: "z.B. 65",
        weightPh: "z.B. 150",
        result: "Ergebnis:",
        unit: "BE",
        langBtn: "RU",
        themeDark: "🌙 Dark",
        themeLight: "☀️ Light"
    },
    ru: {
        title: "Калькулято ХЕ",
        carbs: "Углеводы на 100г продукта (г):",
        weight: "Вес порции (г):",
        carbsPh: "Например: 65",
        weightPh: "Например: 150",
        result: "Итого:",
        unit: "ХЕ",
        langBtn: "DE",
        themeDark: "🌙 Тёмная",
        themeLight: "☀️ Светлая"
    }
};

function calculateXE() {
    const carbs = parseFloat(document.getElementById('carbs').value) || 0;
    const weight = parseFloat(document.getElementById('weight').value) || 0;
    const totalCarbs = (carbs * weight) / 100;
    const xe = totalCarbs / 12;
    document.getElementById('xeValue').innerText = xe.toFixed(1);
}

function toggleLanguage() {
    currentLang = currentLang === 'de' ? 'ru' : 'de';
    const langData = i18n[currentLang];

    document.getElementById('calcTitle').innerText = langData.title;
    document.getElementById('labelCarbs').innerText = langData.carbs;
    document.getElementById('labelWeight').innerText = langData.weight;
    document.getElementById('carbs').placeholder = langData.carbsPh;
    document.getElementById('weight').placeholder = langData.weightPh;
    document.getElementById('labelResult').innerText = langData.result;
    document.getElementById('unitLabel').innerText = langData.unit;
    document.getElementById('langBtn').innerText = langData.langBtn;
    
    updateThemeBtnText();
}

function toggleTheme() {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    } else {
        document.documentElement.removeAttribute('data-theme');
    }
    updateThemeBtnText();
}

function updateThemeBtnText() {
    const langData = i18n[currentLang];
    document.getElementById('themeBtn').innerText = currentTheme === 'light' ? langData.themeDark : langData.themeLight;
}
</script>

</body>
</html>
